<!DOCTYPE html>
<html lang="fr" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>MyToDoList — listes & quick wins</title>

  <!-- Favicons -->
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#2563EB">

  <!-- Styles: Tailwind build generated from styles/main.css (npm run build:css) -->
  <link rel="stylesheet" href="css/main.css">

  <!-- Application (ES modules, deferred by default) -->
  <script type="module" src="js/main.js"></script>
</head>

<body class="font-sans antialiased auth-locked">
  <!-- ══ Login / registration screen (shown while body.auth-locked) ══ -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card relative">
      <button type="button" data-action="toggle-theme"
        class="absolute right-4 top-4 grid h-9 w-9 place-items-center rounded-xl border border-line bg-surface text-muted transition hover:text-ink"
        title="Changer de thème" aria-label="Changer de thème">
        <svg class="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      </button>
      <div class="flex items-center gap-3 mb-6 pr-10">
        <span
          class="grid h-11 w-11 shrink-0 place-items-center rounded-xl bg-accent text-white font-display text-xl font-bold">M</span>
        <div>
          <h1 class="font-display text-xl font-semibold">MyToDoList</h1>
          <p class="text-[12px] text-muted">Vos tâches, votre espace personnel.</p>
        </div>
      </div>
      <h2 id="authTitle" class="font-display text-[19px] font-semibold">Connexion</h2>
      <p id="authSubtitle" class="mt-1 text-[13px] text-muted">Retrouvez vos listes et vos quick wins.</p>
      <form id="authForm" class="mt-4">
        <label for="authUsername" class="auth-label">Identifiant</label>
        <input id="authUsername" class="auth-field" autocomplete="username" required minlength="3" maxlength="32"
          placeholder="Votre identifiant" />
        <label for="authPassword" class="auth-label">Mot de passe</label>
        <input id="authPassword" class="auth-field" type="password" autocomplete="current-password" required
          placeholder="Votre mot de passe" />
        <p id="passwordHelp" class="hidden mt-1 text-[12px] text-muted">12 caractères minimum.</p>
        <p id="authError" class="auth-error" role="alert" hidden></p>
        <button id="authSubmit" type="submit" class="auth-btn">Se connecter</button>
      </form>
      <div class="mt-6 text-center text-[13px] text-muted"><span id="authSwitchHint">Pas encore de compte ?</span>
        <button id="authSwitch" type="button" class="auth-link">Créer un compte</button></div>
    </div>
  </div>

  <!-- ══ Top bar ══ -->
  <header class="sticky top-0 z-30 border-b border-line bg-canvas/85 backdrop-blur-md">
    <div class="mx-auto max-w-6xl px-4 sm:px-6">
      <div class="flex h-16 items-center gap-3">
        <div class="flex items-center gap-2.5 mr-auto min-w-0">
          <span
            class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-accent text-accentink font-display text-lg font-bold">M</span>
          <div class="min-w-0">
            <h1 class="font-display text-[15px] font-semibold leading-tight truncate">MyToDoList</h1>
            <p class="text-[11px] leading-tight text-muted truncate" id="tagline">Avancez par petites victoires</p>
          </div>
        </div>

        <span id="accountLabel" class="hidden sm:block max-w-[130px] truncate text-[12px] text-muted"
          aria-label="Compte connecté"></span>
        <button id="logoutBtn" type="button"
          class="grid h-9 w-9 place-items-center rounded-xl border border-line bg-surface text-muted transition hover:text-ink"
          title="Se déconnecter" aria-label="Se déconnecter">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5M21 12H9" />
          </svg>
        </button>

        <button type="button" data-action="toggle-theme"
          class="grid h-9 w-9 place-items-center rounded-xl border border-line bg-surface text-muted transition hover:text-ink"
          title="Changer de thème" aria-label="Changer de thème">
          <svg id="themeIcon" class="theme-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>

        <button type="button" data-action="reset-all"
          class="hidden sm:grid h-9 w-9 place-items-center rounded-xl border border-line bg-surface text-muted transition hover:text-ink"
          title="Effacer toutes les données" aria-label="Effacer toutes les données">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>

        <button type="button" data-action="new-list"
          class="inline-flex h-9 items-center gap-1.5 rounded-xl bg-ink px-3 text-[13px] font-medium text-canvas transition hover:opacity-90 active:scale-[.98]">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span class="hidden sm:inline">Nouvelle liste</span>
        </button>
      </div>

      <nav class="flex items-center gap-1 pb-2.5">
        <button type="button" data-action="view" data-view="board"
          class="nav-tab inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[13px] font-medium transition">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="18" rx="1.5" />
            <rect x="14" y="3" width="7" height="11" rx="1.5" />
          </svg>
          Mes listes
        </button>
        <button type="button" data-action="view" data-view="history"
          class="nav-tab inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-[13px] font-medium transition">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 2.6-6.4" />
            <path d="M3 4v4h4" />
            <path d="M12 7v5l3 2" />
          </svg>
          Historique <span id="histCount" class="tabular text-muted"></span>
        </button>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 pb-28 pt-5 sm:px-6 sm:pt-7">

    <!-- ══ Board view ══ -->
    <section id="viewBoard">

      <!-- Counters (rendered by renderStats) -->
      <div class="rounded-xl2 border border-line bg-surface">
        <div id="statStrip" class="grid grid-cols-2 divide-line sm:grid-cols-4 sm:divide-x"></div>
      </div>

      <!-- "À faire maintenant" banner (renderQuickWins) -->
      <section id="quickWins" class="mt-4"></section>

      <!-- Search and status filters -->
      <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <svg class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted" width="15" height="15"
            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.2-3.2" />
          </svg>
          <input id="search" type="search" placeholder="Rechercher une tâche…" autocomplete="off"
            class="h-10 w-full rounded-xl border border-line bg-surface pl-9 pr-3 text-[14px] placeholder:text-muted focus:border-accent">
        </div>
        <div class="scroll-x -mx-4 overflow-x-auto px-4 sm:mx-0 sm:px-0">
          <div id="filters" class="flex w-max gap-1 rounded-xl border border-line bg-surface p-1"></div>
        </div>
      </div>

      <!-- Active list cards (renderLists) -->
      <div id="lists" class="mt-4 grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>

    <!-- ══ History view (archived lists) ══ -->
    <section id="viewHistory" class="hidden">
      <div id="historyHead"></div>
      <div id="history" class="mt-4 grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>
  </main>

  <!-- ══ Task dialog ══ -->
  <div id="taskModal"
    class="modal-hidden fixed inset-0 z-50 flex items-end justify-center bg-black/45 p-0 backdrop-blur-xs transition-opacity sm:items-center sm:p-6"
    role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
    <div
      class="sheet max-h-[92dvh] w-full overflow-y-auto rounded-t-2xl border border-line bg-surface p-5 sm:max-w-lg sm:rounded-2xl">
      <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-line sm:hidden"></div>
      <h2 id="taskModalTitle" class="font-display text-lg font-semibold">Nouvelle tâche</h2>
      <form id="taskForm" class="mt-4 space-y-4" novalidate>
        <div>
          <label for="tName" class="mb-1.5 block text-[13px] font-medium text-muted">Nom</label>
          <input id="tName" required maxlength="120" placeholder="Ex. Répondre au devis Lambert"
            class="h-11 w-full rounded-xl border border-line bg-canvas px-3 text-[14px] focus:border-accent">
        </div>
        <div>
          <label for="tDesc" class="mb-1.5 block text-[13px] font-medium text-muted">Description <span
              class="text-muted/70">(facultatif)</span></label>
          <textarea id="tDesc" rows="2" maxlength="600" placeholder="Le contexte utile pour s'y remettre sans réfléchir"
            class="w-full resize-y rounded-xl border border-line bg-canvas px-3 py-2.5 text-[14px] focus:border-accent"></textarea>
        </div>
        <div class="grid gap-4 sm:grid-cols-2">
          <div>
            <label for="tList" class="mb-1.5 block text-[13px] font-medium text-muted">Liste</label>
            <select id="tList"
              class="h-11 w-full rounded-xl border border-line bg-canvas px-3 text-[14px] focus:border-accent"></select>
          </div>
          <div>
            <label for="tDur" class="mb-1.5 block text-[13px] font-medium text-muted">Durée estimée</label>
            <select id="tDur"
              class="h-11 w-full rounded-xl border border-line bg-canvas px-3 text-[14px] focus:border-accent"></select>
          </div>
        </div>
        <div>
          <span class="mb-1.5 block text-[13px] font-medium text-muted">Criticité</span>
          <div id="tCrit" class="grid grid-cols-4 gap-1.5"></div>
        </div>
        <div>
          <span class="mb-1.5 block text-[13px] font-medium text-muted">Statut</span>
          <div id="tStatus" class="grid grid-cols-3 gap-1.5"></div>
        </div>
        <div id="tHint"
          class="hidden items-start gap-2 rounded-xl bg-accent/15 p-3 text-[12.5px] leading-snug text-ink"></div>
        <div class="flex gap-2 pt-1">
          <button type="button" data-action="close-modal"
            class="h-11 flex-1 rounded-xl border border-line bg-surface text-[14px] font-medium text-muted transition hover:text-ink">Annuler</button>
          <button type="submit" id="tSubmit"
            class="h-11 flex-[1.4] rounded-xl bg-accent text-[14px] font-semibold text-accentink transition hover:brightness-105 active:scale-[.99]">Ajouter
            la tâche</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══ List dialog ══ -->
  <div id="listModal"
    class="modal-hidden fixed inset-0 z-50 flex items-end justify-center bg-black/45 p-0 backdrop-blur-xs transition-opacity sm:items-center sm:p-6"
    role="dialog" aria-modal="true" aria-labelledby="listModalTitle">
    <div class="sheet w-full rounded-t-2xl border border-line bg-surface p-5 sm:max-w-sm sm:rounded-2xl">
      <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-line sm:hidden"></div>
      <h2 id="listModalTitle" class="font-display text-lg font-semibold">Nouvelle liste</h2>
      <form id="listForm" class="mt-4 space-y-4" novalidate>
        <div>
          <label for="lName" class="mb-1.5 block text-[13px] font-medium text-muted">Nom de la liste</label>
          <input id="lName" required maxlength="60" placeholder="Ex. Refonte du site"
            class="h-11 w-full rounded-xl border border-line bg-canvas px-3 text-[14px] focus:border-accent">
        </div>
        <div class="flex gap-2">
          <button type="button" data-action="close-modal"
            class="h-11 flex-1 rounded-xl border border-line bg-surface text-[14px] font-medium text-muted transition hover:text-ink">Annuler</button>
          <button type="submit" id="lSubmit"
            class="h-11 flex-[1.4] rounded-xl bg-accent text-[14px] font-semibold text-accentink transition hover:brightness-105 active:scale-[.99]">Créer
            la liste</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ══ Confirmation dialog ══ -->
  <div id="confirmModal"
    class="modal-hidden fixed inset-0 z-[60] flex items-end justify-center bg-black/45 p-0 backdrop-blur-xs transition-opacity sm:items-center sm:p-6"
    role="dialog" aria-modal="true" aria-labelledby="cTitle">
    <div class="sheet w-full rounded-t-2xl border border-line bg-surface p-5 sm:max-w-sm sm:rounded-2xl">
      <div class="mx-auto mb-4 h-1 w-10 rounded-full bg-line sm:hidden"></div>
      <h2 id="cTitle" class="font-display text-base font-semibold">Confirmer</h2>
      <p id="cBody" class="mt-1.5 text-[13.5px] leading-relaxed text-muted"></p>
      <div class="mt-5 flex gap-2">
        <button type="button" data-action="close-modal"
          class="h-11 flex-1 rounded-xl border border-line bg-surface text-[14px] font-medium text-muted transition hover:text-ink">Annuler</button>
        <button type="button" id="cOk"
          class="h-11 flex-1 rounded-xl bg-rose-600 text-[14px] font-semibold text-white transition hover:brightness-110">Supprimer</button>
      </div>
    </div>
  </div>

  <!-- ══ Toast notification ══ -->
  <div id="toast"
    class="pointer-events-none fixed inset-x-0 bottom-6 z-[70] flex justify-center px-4 opacity-0 transition-opacity duration-200"
    role="status" aria-live="polite">
    <div
      class="rounded-full border border-line bg-surface px-4 py-2.5 text-[13px] font-medium shadow-lg shadow-black/10">
      <span id="toastText"></span></div>
  </div>

</body>

</html>
